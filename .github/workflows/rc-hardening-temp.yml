name: RC hardening temporary validation

on:
  push:
    branches:
      - rc-hardening-third-pass-20260914

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Show scripts
        run: npm run
      - name: Test
        run: npm test
      - name: Signup regression
        run: node scripts/private-signup-regression.mjs
      - name: Emergency smoke
        run: npm run smoke:thread1
      - name: Production build
        run: npm run build
