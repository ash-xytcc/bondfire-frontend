name: Security hardening validation
on:
  push:
    branches:
      - security/v3-final-hardening-20260914
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke:thread1
      - run: npm run build
